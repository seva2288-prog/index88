<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Квантум PRO v4.2 — Слой 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0B0E17;
            color: #E0E0E0;
            padding-bottom: 70px;
        }
        .header {
            background: #0B0E17;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1F2633;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 span {
            background: #00E676;
            color: #0B0E17;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
        }
        .header .live {
            color: #00E676;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header .live::before {
            content: "●";
            animation: pulse-dot 1.5s infinite;
        }
        @keyframes pulse-dot {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
            animation: fadeSlide 0.25s ease;
        }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .card {
            background: #141A26;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #1F2633;
            text-align: center;
        }
        .card h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .card p {
            color: #9E9E9E;
            font-size: 14px;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #0B0E17;
            border-top: 1px solid #1F2633;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 12px;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #9E9E9E;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px 12px;
            font-family: inherit;
            transition: 0.15s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .nav-item .icon {
            font-size: 24px;
            line-height: 1.2;
        }
        .nav-item.active {
            color: #00E676;
        }
        .nav-item.active .icon {
            transform: scale(1.05);
        }
        .nav-item:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔥 КВАНТУМ PRO <span>v4.2</span></h1>
        <div class="live">LIVE</div>
    </div>

    <div class="container" id="appContainer">

        <!-- ГЛАВНАЯ -->
        <div class="screen active" id="screen-home">
            <div class="card">
                <h2>🏠 Главная</h2>
                <p>Здесь будет карточка матча</p>
            </div>
        </div>

        <!-- ИСТОРИЯ -->
        <div class="screen" id="screen-history">
            <div class="card">
                <h2>📋 История</h2>
                <p>Здесь будет список матчей</p>
            </div>
        </div>

        <!-- НАСТРОЙКИ (теперь 4-й таб) -->
        <div class="screen" id="screen-settings">
            <div class="card">
                <h2>⚙️ Настройки</h2>
                <p>Здесь будут настройки</p>
            </div>
        </div>

        <!-- ОБУЧЕНИЕ (теперь 3-й таб) -->
        <div class="screen" id="screen-training">
            <div class="card">
                <h2>🧠 Обучение</h2>
                <p>Здесь будет обучение AI</p>
            </div>
        </div>
    </div>

    <!-- НАВИГАЦИЯ (новый порядок: Главная, История, Обучение, Настройки) -->
    <div class="nav-bar" id="navBar">
        <button class="nav-item active" data-tab="screen-home">
            <span class="icon">🏠</span>Главная
        </button>
        <button class="nav-item" data-tab="screen-history">
            <span class="icon">📋</span>История
        </button>
        <button class="nav-item" data-tab="screen-training">
            <span class="icon">🧠</span>Обучение
        </button>
        <button class="nav-item" data-tab="screen-settings">
            <span class="icon">⚙️</span>Настройки
        </button>
    </div>

    <script>
        (function() {
            'use strict';

            console.log('✅ Слой 1 — навигация загружена');

            // ============================================================
            // НАВИГАЦИЯ
            // ============================================================
            const navItems = document.querySelectorAll('.nav-item');
            const screens = {
                'screen-home': document.getElementById('screen-home'),
                'screen-history': document.getElementById('screen-history'),
                'screen-training': document.getElementById('screen-training'),
                'screen-settings': document.getElementById('screen-settings')
            };

            navItems.forEach(function(item) {
                item.addEventListener('click', function() {
                    const target = this.dataset.tab;

                    navItems.forEach(function(i) {
                        i.classList.remove('active');
                    });

                    this.classList.add('active');

                    Object.keys(screens).forEach(function(key) {
                        screens[key].classList.remove('active');
                    });

                    if (screens[target]) {
                        screens[target].classList.add('active');
                    }

                    console.log('🔀 Переключено на:', target);
                });
            });

            console.log('✅ Навигация настроена (порядок: Главная, История, Обучение, Настройки)');
        })();
    </script>
</body>
</html>
